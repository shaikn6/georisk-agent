[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georisk-agent"
version = "0.3.0"
description = "Multispectral satellite risk screening (flood, wildfire fuel, urban encroachment) with an explainable scoring layer and optional LLM narrative"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pyproj>=3.6",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "rasterio>=1.3",
  "shapely>=2.0",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
research = ["scikit-learn>=1.4"]
deep = ["torch>=2.2", "timm>=1.0", "einops>=0.7", "huggingface_hub>=0.23"]  # foundation-model experiment only
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
georisk = "georisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the public Earth Search STAC API (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
georisk = ["data/*.json", "web/*.html"]
