name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a stalled dependency install once took 8+ minutes; never let a stall hang the pipeline
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests app.py
      - name: Offline tests
        run: pytest -q -m "not network" --cov=georisk --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Live Sentinel-2 smoke test
        run: pytest -q -m network
        continue-on-error: true   # depends on a public API being reachable
  docker:
    # The image once shipped without libexpat: offline tests passed, live imagery returned a 500. Build it and prove the real imagery stack loads.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t georisk-ci .
      - name: Imagery stack imports inside the image
        run: docker run --rm georisk-ci python -c "import georisk.providers._common, georisk.providers.planetary, georisk.terrain, georisk.grid, rasterio, shapely; print('imagery stack OK, GDAL', rasterio.__gdal_version__)"
      - name: Service starts and answers
        run: |
          docker run -d --name g -p 8000:8000 georisk-ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/assess -H 'content-type: application/json' -d '{"lat":39.96,"lon":-83.0,"archetype":"floodplain"}' | python3 -c "import json,sys; j=json.load(sys.stdin); assert j['overall'] is not None; print('offline assessment OK')"
